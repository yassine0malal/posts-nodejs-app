<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    

    table {
        border-collapse: collapse;
    }

    tr {
        border-bottom: 1px solid #31598d;
    }

    td,
    tr {
        border: 1px solid #4471a9;
        /* Draws lines around every cell */
        padding: 12px 16px;

    }

    table tbody tr {
        border-bottom: 1px solid #462f2f;
        transition: background-color 0.2s ease;
    }
</style>

<body>
    <table id="table">
        <thead>
            <tr>
                <td>ID</td>
                <td>UserID</td>
                <td>Title</td>
                <td>Body</td>
            </tr>
        </thead>
        <tbody>

        </tbody>

    </table>

    <script>
        async function getAllPosts() {
            try {
                const response = await fetch("http://localhost:3000/api/posts");
                if (!response.ok) {
                    throw new Error(`Response status: ${response.status}`);
                }
                const data = await response.json();
                return data;
            } catch (error) {
                console.error("Error in loading", error.message)
            }
        }
        let data = getAllPosts();
        data.then((posts) => {

            const tbody = document.querySelector("#table tbody");
            console.log("--", posts)
            // tbody.innerHTML = "";
            posts.map((ele) => {
                const tr = `
                    <tr>
                        <td>${ele.id}</td>
                        <td>${ele.userId}</td>
                        <td>${ele.title}</td>
                        <td>${ele.body}</td>
                    </tr>
                `;
                tbody.insertAdjacentHTML("beforeend", tr)
            })

        })




    </script>
</body>

</html>
